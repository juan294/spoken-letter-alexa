packages:
  - packages/*
  - infra
  - amazon
allowBuilds:
  ask-cli: false
  better-sqlite3: false
  dtrace-provider: false
  esbuild: true
  ffmpeg-static: true
  node-llama-cpp: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
minimumReleaseAgeExclude:
  - '@types/node@26.5.0'
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
overrides:
  adm-zip@<0.6.1: 0.6.1
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  fast-uri@<3.1.8: 3.1.8
  immutable@<4.3.9: 4.3.9
  ip-address@<10.7.1: 10.7.1
  semver@>=7.0.0 <7.5.2: 7.5.2
  uuid@<11.1.1: 11.1.1
